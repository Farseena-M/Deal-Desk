
services:
  # React + Vite Frontend
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: dealdesk-frontend
    ports:
      - "5173:5173"
    env_file:
      - ./FrontEnd/.env
    environment:
      VITE_API_URL: http://localhost:3000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  # NestJS Backend
  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: dealdesk-backend
    ports:
      - "3000:3000"
    env_file:
      - ./BackEnd/.env
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/dealdesk?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BILLPORT_URL: http://billport:5000
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  # Express BillPort
  billport:
    build:
      context: ./BillPort
      dockerfile: Dockerfile
    container_name: dealdesk-billport
    ports:
      - "5000:5000"
    env_file:
      - ./BillPort/.env
    environment:
      PORT: 5000
      DEALDESK_WEBHOOK_URL: http://backend:3000/api/v1/webhooks/billport
    restart: unless-stopped

  # MongoDB with Replica Set
  mongodb:
    image: mongo:7
    container_name: dealdesk-mongodb
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mongosh --quiet --eval
          "try { rs.status().ok } catch(e) {
          rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok
          }"
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  # Redis for BullMQ
  redis:
    image: redis:7-alpine
    container_name: dealdesk-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
